name: Elecrow ESP32P4 Display
version: "1.2.5"
slug: crow_ws_panel
description: Home Assistant Display plugin for Elecrow panels based on ESP32P4
url: https://github.com/fintros/crow-ha
arch:
  - amd64
  - aarch64
init: false
apparmor: false
auth_api: true
hassio_api: true
homeassistant_api: true
ports:
  "3000/tcp": 3000
ports_description:
  "3000/tcp": WebSocket stream + touch input for the panel device

options:
  screen_count: 1
  audio_enabled: false
  microphone_enabled: false
schema:
  screen_count: int(1,16)
  audio_enabled: bool
  microphone_enabled: bool
